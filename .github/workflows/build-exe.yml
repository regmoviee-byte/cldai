name: Windows exe

on:
  push:
    paths:
      - "aihub/**"
      - "launcher/**"
      - "tests/**"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Unit tests (Windows)
        run: python -m unittest discover -s tests -v

      - name: Build aihub.exe
        shell: bash
        run: ./launcher/build.sh

      - name: Smoke test aihub.exe (window, no consoles, install buttons, close)
        shell: pwsh
        run: |
          $env:AIHUB_HOME = "$env:RUNNER_TEMP\aihub-home"
          $log = "$env:LOCALAPPDATA\aihub\aihub.log"
          $p = Start-Process dist\aihub.exe -PassThru
          $url = $null
          for ($i = 0; $i -lt 90 -and -not $url; $i++) {
            Start-Sleep 1
            if (Test-Path $log) {
              $m = Select-String -Path $log -Pattern '^AIHUB_URL (\S+)'
              if ($m) { $url = $m.Matches[0].Groups[1].Value }
            }
          }
          if (-not $url) { Get-Content $log -ErrorAction SilentlyContinue; throw "server did not start" }
          Write-Host "url: $url"
          $r = Invoke-WebRequest $url -UseBasicParsing
          $token = [regex]::Match($r.Content, 'const TOKEN = "([^"]+)"').Groups[1].Value
          $h = @{ "X-Aihub-Token" = $token }

          # A real window titled "aihub"; the Python server must not have one.
          Start-Sleep 3
          $app = Get-Process -Id $p.Id
          Write-Host "window: '$($app.MainWindowTitle)' handle=$($app.MainWindowHandle)"
          if ($app.MainWindowTitle -ne "aihub") { throw "no aihub window" }
          $py = Get-Process python -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "*\aihub\runtime-*" }
          if (-not $py) { throw "server process not found" }
          if ($py | Where-Object { $_.MainWindowHandle -ne 0 }) { throw "server has a visible window" }
          Get-Process conhost, WindowsTerminal -ErrorAction SilentlyContinue | Format-Table Id, Name, MainWindowTitle

          # Second launch: no second copy, the first window stays.
          Start-Process dist\aihub.exe
          Start-Sleep 4
          $copies = @(Get-Process aihub -ErrorAction SilentlyContinue).Count
          Write-Host "aihub processes after second launch: $copies"
          if ($copies -ne 1) { throw "second launch started another copy" }

          # "Установить" buttons: installs run hidden in the background; wait until detected.
          foreach ($a in "claude", "codex") {
            Invoke-RestMethod "$($url)api/agent-action" -Method Post -Headers $h -ContentType "application/json" `
              -Body (@{ agent = $a; action = "install" } | ConvertTo-Json) | Out-Null
          }
          $found = $false
          for ($i = 0; $i -lt 60 -and -not $found; $i++) {
            Start-Sleep 5
            $d = Invoke-RestMethod "$($url)api/doctor?refresh=1" -Headers $h
            Write-Host ("claude: installed={0} login={1} {2} [{3}] | codex: installed={4} login={5} {6} [{7}]" -f `
              $d.claude.installed, $d.claude.logged_in, $d.claude.version, $d.claude.action.state,
              $d.codex.installed, $d.codex.logged_in, $d.codex.version, $d.codex.action.state)
            $found = $d.claude.installed -and $d.codex.installed
          }
          Get-Content "$env:AIHUB_HOME\logs\install-claude.log" -Tail 15 -ErrorAction SilentlyContinue
          Get-Content "$env:AIHUB_HOME\logs\install-codex.log" -Tail 8 -ErrorAction SilentlyContinue
          if (-not $found) { throw "agents not detected after install" }
          if ($d.claude.logged_in -ne $false) { throw "fresh claude should report logged_in=false" }

          # Closing the window stops the server.
          $app.CloseMainWindow() | Out-Null
          Start-Sleep 8
          if (Get-Process -Id $p.Id -ErrorAction SilentlyContinue) { throw "app did not exit on close" }
          if (Get-Process python -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "*\aihub\runtime-*" }) {
            throw "server still running after the window was closed"
          }
          Write-Host "closed cleanly"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aihub-windows
          path: dist/aihub.exe
